name: PHP Tests — Customer Site

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint + Security  (fast, no DB, blocks PRs in ~30s)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-site
    steps:
      # composer.json's path repositories point at ../saas-platform, so both
      # repos must sit as siblings INSIDE $GITHUB_WORKSPACE (checkout refuses
      # a parent-directory path): customer-site/ and saas-platform/.
      - uses: actions/checkout@v4
        with:
          path: customer-site

      - name: Checkout saas-platform (Composer path repository source)
        uses: actions/checkout@v4
        with:
          repository: safhenokhostweb-art/saas-platform
          ref: main
          path: saas-platform
          ssh-key: ${{ secrets.SAAS_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: customer-site/vendor
          key: customer-composer-${{ hashFiles('customer-site/composer.lock') }}
          restore-keys: customer-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        # package:discover boots the app before any .env/testing DB exists;
        # an in-memory SQLite keeps that bootstrap independent of a DB file.
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          BROADCAST_DRIVER: log
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Validate composer.json
        # --strict would fail on the intentional @dev constraints of the
        # sibling path repositories that CI checks out from saas-platform.
        run: composer validate --no-check-publish

      - name: PHP syntax lint (app + config + routes + tests)
        run: php scripts/ci-lint.php

      - name: Security audit
        run: composer audit --no-dev
        # non-zero exit if known vulnerabilities exist in production deps

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — Feature Tests (MySQL)
  # ──────────────────────────────────────────────────────────────────────────
  feature-tests:
    name: Feature Tests (MySQL 8.0)
    runs-on: ubuntu-latest
    needs: lint              # don't spin up MySQL if lint fails
    defaults:
      run:
        working-directory: customer-site

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: customer_site_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: customer-site

      - name: Checkout saas-platform (Composer path repository source)
        uses: actions/checkout@v4
        with:
          repository: safhenokhostweb-art/saas-platform
          ref: main
          path: saas-platform
          ssh-key: ${{ secrets.SAAS_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, pdo_mysql, gd, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: customer-site/vendor
          key: customer-composer-${{ hashFiles('customer-site/composer.lock') }}
          restore-keys: customer-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          BROADCAST_DRIVER: log
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Prepare test environment
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing

      - name: Run migrations
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: customer_site_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --env=testing --force

      - name: Run feature tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: customer_site_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          PAYMENT_GATEWAY: ""
          EDUCATION_AI_PROVIDER: "null"
          EDUCATION_AI_QUOTA_ENABLED: "false"
        run: php artisan test --stop-on-failure

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-customer
          path: storage/logs/
          # Category E (test/debug) default per storage policy. Was 7d;
          # bump back up if weekend on-call debugging needs a longer window.
          retention-days: 1
